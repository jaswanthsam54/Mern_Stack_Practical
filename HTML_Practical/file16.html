<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple ARIA Label Example</title>
</head>
<body>

  <!-- Button with icon only -->
  <button aria-label="Close">hey</button>

  <!-- Input field without visible label -->
  <input type="text" aria-label="Search">

  <!-- Navigation with label -->
  <nav aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

</body>
</html>
